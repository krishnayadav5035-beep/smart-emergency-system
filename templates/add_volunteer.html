<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Volunteer</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<nav class="navbar">

    <div class="logo">
        🚨 Smart Emergency
    </div>

    <div class="nav-links">
        <a href="/">Home</a>
        <a href="/dashboard">Dashboard</a>
        <a href="/resources">Manage Resources</a>
        <a href="/volunteers">Volunteers</a>
        <a href="/logout">Logout</a>
    </div>

</nav>


<section class="dashboard-section">

    <div class="dashboard-header">

        <span class="badge">
            👥 Volunteer Management
        </span>

        <h1>Add Volunteer</h1>

        <p>
            Add a new emergency response volunteer.
        </p>
        

    </div>


    <div class="emergency-details-card">

        <form method="POST">

            <div class="details-grid">

                <div class="detail-item">

                    <strong>Name</strong>

                    <input
                        type="text"
                        name="name"
                        required
                        placeholder="Enter volunteer name"
                    >

                </div>


                <div class="detail-item">

                    <strong>Email</strong>

                    <input
                        type="email"
                        name="email"
                        required
                        placeholder="Enter email"
                    >

                </div>


                <div class="detail-item">

                    <strong>Phone</strong>

                    <input
                        type="text"
                        name="phone"
                        placeholder="Enter phone number"
                    >

                </div>


                <div class="detail-item">

                    <strong>Skills</strong>

                    <input
                        type="text"
                        name="skills"
                        placeholder="First Aid, Rescue, Security"
                    >

                </div>


                <div class="detail-item">

                    <strong>Availability</strong>

                    <select name="availability">

                        <option value="Available">
                            Available
                        </option>

                        <option value="Busy">
                            Busy
                        </option>

                        <option value="Unavailable">
                            Unavailable
                        </option>

                    </select>

                </div>

            </div>


            <div class="detail-actions">

                <a href="/volunteers"
                   class="secondary-btn">
                    ← Cancel
                </a>

                <button
                    type="submit"
                    class="primary-btn">
                    ➕ Add Volunteer
                </button>

            </div>

        </form>

    </div>

</section>

</body>
</html>
