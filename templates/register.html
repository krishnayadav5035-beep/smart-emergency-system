<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - Smart Emergency</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<nav class="navbar">

    <div class="logo">
        🚨 Smart Emergency
    </div>

    <div class="nav-links">
        <a href="/">Home</a>
        <a href="/login">Login</a>
    </div>

</nav>


<section class="login-section">

    <div class="login-card">

        <div class="login-header">

            <span class="badge">
                📝 Create Account
            </span>

            <h1>Register</h1>

            <p>
                Create your Smart Emergency account.
            </p>

        </div>


        {% if error %}

        <div class="login-error">
            {{ error }}
        </div>

        {% endif %}


        <form method="POST">

            <div class="form-group">

                <label for="name">
                    Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your name"
                    required
                >

            </div>


            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    required
                >

            </div>


            <button type="submit" class="primary-btn">
                📝 Create Account
            </button>

        </form>


        <div class="login-footer">

            Already have an account?

            <a href="/login">
                Login
            </a>

        </div>

    </div>

</section>

</body>
</html>
